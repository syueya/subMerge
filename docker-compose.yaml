services:
  submerge:
    image: syueya/submerge:latest
    container_name: submerge
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      - APP_ENV=production
      - ENCRYPTION_KEY=change-me-to-a-long-random-secret-key # 至少 32 字符，用于加密上游订阅 URL 与分享令牌
      - PUBLIC_BASE_URL=http://localhost:8080 # 对外访问根地址（生成订阅链接用）
      - SOURCE_FETCH_UA=clash-verge/v2.5.3
      - LOG_OUTPUT=both
      - LOG_RETENTION_DAYS=7
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./log:/app/log
