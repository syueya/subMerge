services:
  submerge:
    image: ${SUBMERGE_IMAGE:-ghcr.io/syueya/submerge}:${SUBMERGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SUBMERGE_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      TZ: ${TZ:-Asia/Shanghai}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      SUBMERGE_UPDATE_DIR: /app/runtime
      SUBMERGE_RESTART_MODE: exit
    volumes:
      - ./data:/app/data
      - ./data/log:/app/log
      - ./data/geo:/app/defaults/geo
      - ./bin:/app/runtime
