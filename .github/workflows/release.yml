name: Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-assets:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
      build-date: ${{ steps.metadata.outputs.build-date }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release source and version tag
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must be built from main, got $GITHUB_REF" >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          tag="v${version}"
          existing="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote --refs origin "refs/tags/${tag}" | awk '{print $1}')"
          fi
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "${tag} already points to ${existing}, not this commit ${GITHUB_SHA}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fronted/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build, test, and sign release assets
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: ./scripts/build-release.ps1 -RequireSigningKey -Repository $env:GITHUB_REPOSITORY

      - id: metadata
        name: Export release metadata
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/release/
          if-no-files-found: error
          retention-days: 2

  container:
    needs: release-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/release

      - name: Export injected public key
        shell: bash
        run: echo "UPDATE_PUBLIC_KEY_BASE64=$(tr -d '[:space:]' < dist/release/update-public-key.txt)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: release-tags
        name: Derive container tags from release version
        shell: bash
        env:
          VERSION: ${{ needs.release-assets.outputs.version }}
        run: |
          base_version="${VERSION%%-*}"
          major_minor="$(printf '%s' "$base_version" | cut -d. -f1-2)"
          echo "major-minor=${major_minor}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.release-assets.outputs.image }}
          tags: |
            type=raw,value=${{ needs.release-assets.outputs.version }}
            type=raw,value=${{ steps.release-tags.outputs.major-minor }}
            type=raw,value=latest,enable=${{ steps.release-tags.outputs.stable == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-assets.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.release-assets.outputs.build-date }}
            UPDATE_PUBLIC_KEY_BASE64=${{ env.UPDATE_PUBLIC_KEY_BASE64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test published image
        shell: bash
        env:
          IMAGE: ${{ needs.release-assets.outputs.image }}
          VERSION: ${{ needs.release-assets.outputs.version }}
        run: |
          container="$(docker run --detach --publish 127.0.0.1::8080 "${IMAGE}:${VERSION}")"
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          port="$(docker port "$container" 8080/tcp | sed 's/.*://')"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/api/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "published container did not become healthy" >&2
          exit 1

  publish:
    needs: [release-assets, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/release

      - name: Create or verify release tag
        shell: bash
        env:
          VERSION: ${{ needs.release-assets.outputs.version }}
        run: |
          tag="v${VERSION}"
          existing="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote --refs origin "refs/tags/${tag}" | awk '{print $1}')"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "${tag} already points to ${existing}, not this commit ${GITHUB_SHA}" >&2
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$GITHUB_SHA" --message "Release ${tag}"
          git push origin "$tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-assets.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.release-assets.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.release-assets.outputs.version, '-') }}
          files: |
            dist/release/submerge-linux-amd64
            dist/release/submerge-linux-arm64
            dist/release/docker-compose.yml
            dist/release/update-manifest.json
            dist/release/update-manifest.json.sig
