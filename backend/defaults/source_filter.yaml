# 新建订阅源时的默认过滤（写入该源配置，之后可在面板按源修改）
# 与 rules.yaml / regions.yaml 同属 backend/defaults/ 内置默认配置。

# 名称匹配此正则的节点在拉取时丢弃（不区分大小写）
# 含「过滤掉N条」等机场信息节点
excludeNameRegex: 剩余流量|套餐到期|流量|到期|过期|官网|电报|重置|距离下次|消耗|续费|客服|公告|测试|过滤掉|过滤了|已过滤

# server 黑名单，逗号分隔
excludeServers: 127.0.0.1,0.0.0.0,localhost

# 可选白名单；空表示不过滤。非空时只保留名称匹配的节点
includeNameRegex: ""
