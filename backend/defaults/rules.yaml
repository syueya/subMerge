# 空库默认分流规则（backend/defaults/）——业务默认规则的唯一来源。
# 空库：整表写入；已有库启动时只「补缺」（YAML 有、库中 type+payload 没有才插入），不覆盖用户已改出口。
# 策略组见 groups.yaml（仅 直连 / 拒绝 / 各国）。
#
# 本文件只维护业务规则（AI / 流媒体 / PT…）。以下三条由代码固定生成，不要写进本文件：
#   广告 GEOSITE category-ads-all → 拒绝（最前，系统分类）
#   国内 GEOIP CN → 直连（倒数第二，系统分类）
#   MATCH 兜底 → 美国US（最后，系统分类）
#
# 面向大陆用户的业务默认出口（可按机场线路再改）：
#   AI / Netflix 等需解锁 → 美国US
#   YouTube / 开发(GitHub·Docker) / 多数国外站 → 日本JP（延迟通常优于美西）
#   电报 / 社交 → 香港HK
#
# 顺序 = 本文件列表顺序（命中即停），seed 时自动编号，无需写 sortOrder。
# 字段顺序：category 放最前（面板分组显眼）；个人域名请在面板「批量导入」添加（不会写回此文件）。

