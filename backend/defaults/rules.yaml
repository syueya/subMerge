# 空库默认分流规则（backend/defaults/）。
# 已有数据不会自动覆盖；修改后需重新编译且空库/无规则时才会写入。
# 策略组见 groups.yaml（仅 直连 / 拒绝 / 各国）。
#
# 面向大陆用户的默认出口（可按机场线路再改）：
#   广告 → 拒绝
#   AI / Netflix 等需解锁 → 美国US
#   YouTube / 开发(GitHub·Docker) / 多数国外站 → 日本JP（延迟通常优于美西）
#   电报 / 社交 → 香港HK
#   国内 GEOIP → 直连
#   MATCH → 日本JP（未命中规则的境外流量走近端代理）
#
# 顺序 = 本文件列表顺序（命中即停），seed 时自动编号，无需写 sortOrder。
# 本文件仅放公共默认；个人域名请在面板「批量导入」添加（不会写回此文件）。

