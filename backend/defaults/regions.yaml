# 统一地区配置（目录 + 节点名识别）
# 改后需重新编译。UI 下拉、回退码、国旗/关键词识别都读本文件。
#
# 字段：
#   code      地区码（节点名前缀，如 US-xxx）
#   name      中文名（UI / 策略组展示）
#   primary   true=常用国家，空库会单独建策略组「{name}{code}」；其余进「其他国家」
#   flag      国旗 emoji（节点名识别，可选）
#   keywords  关键词列表（节点名识别，可选；长词优先由代码排序）
#
# UNK 仅作自动模式回退，不参与识别规则、不进策略组（节点前缀如 UNK-xxx）。

regions:
  - { code: UNK, name: 未知 }

  # —— 常用国家（默认独立策略组）——
