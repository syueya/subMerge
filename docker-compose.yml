services:
  submerge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: submerge:${APP_VERSION:-latest}
    container_name: submerge
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # 路径不覆盖：WORKDIR=/app → 默认 /app/data /app/log /app/frontend/...
      APP_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      LOG_OUTPUT: ${LOG_OUTPUT:-both}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - submerge-data:/app/data
      - submerge-log:/app/log
    restart: unless-stopped

volumes:
  submerge-data:
  submerge-log:
