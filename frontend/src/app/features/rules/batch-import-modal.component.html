@if (open) {
	<div class="dialog-overlay" (click)="close()">
		<div class="dialog-panel dialog-panel-md" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
			<div class="dialog-header">
				<button
					class="dialog-close"
					type="button"
					[disabled]="batchImporting()"
					(click)="close()"
					title="关闭"
					aria-label="关闭"
				>
					<span class="dialog-close-x" aria-hidden="true">×</span>
				</button>
				<div class="dialog-header-text">
					<h3 class="dialog-title">批量导入规则</h3>
					<p class="dialog-header-sub">一行一条；适合个人域名/中转 API，不写进默认 seed</p>
				</div>
			</div>
			<div class="dialog-body space-y-3">
				<div>
					<label class="field-label">
						规则文本
						<app-field-tip [text]="tipBatchImport" />
					</label>
					<textarea
						class="w-full font-mono text-sm"
						rows="12"
						[(ngModel)]="batchImportText"
						placeholder="个人,DOMAIN-SUFFIX,xiaxiazi.ccwu.cc,直连,域名&#10;海外AI,DOMAIN-SUFFIX,openai.com,美国US,AI-OpenAI&#10;gpt-api.xxww.online"
					></textarea>
				</div>
				<div class="grid gap-3 sm:grid-cols-2">
					<div>
						<label class="field-label">默认类型（仅写匹配内容时）</label>
						<select class="w-full" [(ngModel)]="batchImportDefaultType">
							@for (t of ruleTypes; track t.value) {
								@if (t.value !== 'MATCH') {
									<option [ngValue]="t.value">{{ t.text }}</option>
								}
							}
						</select>
					</div>
					<div>
						<label class="field-label">默认出口</label>
						<select class="w-full" [(ngModel)]="batchImportDefaultTarget">
							@for (g of groups; track g.id) {
								<option [ngValue]="g.name">{{ g.name }}</option>
							}
						</select>
					</div>
					<div>
						<label class="field-label">默认备注（可选）</label>
						<input class="w-full" [(ngModel)]="batchImportDefaultNote" placeholder="例如：个人-中转" />
					</div>
					<div>
						<label class="field-label">默认分类（可选）</label>
						<select class="w-full" [(ngModel)]="batchImportDefaultCategory">
							@for (c of batchCategorySelectOptions(); track c.value) {
								<option [ngValue]="c.value">{{ c.text }}</option>
							}
						</select>
						@if (batchImportDefaultCategory === categoryNewValue) {
							<input
								class="mt-2 w-full"
								[(ngModel)]="batchImportDefaultCategoryCustom"
								placeholder="输入新分类名，例如：个人"
							/>
						}
					</div>
				</div>
				<label class="flex items-center gap-2 text-sm text-muted">
					<input type="checkbox" [(ngModel)]="batchImportEnabled" />
					启用导入的规则
				</label>
			</div>
			<div class="dialog-actions">
				<button class="btn-secondary" type="button" [disabled]="batchImporting()" (click)="close()">
					取消
				</button>
				<button class="btn-primary" type="button" [disabled]="batchImporting()" (click)="submitBatchImport()">
					{{ batchImporting() ? '导入中…' : '导入' }}
				</button>
			</div>
		</div>
	</div>
}
