<div class="min-h-screen flex items-center justify-center px-4">
	<div class="card w-full max-w-md">
		<div class="mb-6 flex items-start gap-3">
			<img src="logo.svg" alt="SubMerge" class="h-11 w-11 shrink-0" />
			<div>
				<h1 class="text-2xl font-semibold tracking-tight">SubMerge</h1>
				<p class="mt-1 text-sm text-muted">
					@if (checking()) {
						Clash 订阅合并与配置下发面板
					} @else if (needsSetup()) {
						首次使用：创建管理员账号
					} @else {
						登录管理面板
					}
				</p>
			</div>
		</div>

		@if (checking()) {
			<p class="text-sm text-muted">检查初始化状态…</p>
		} @else {
			<form class="space-y-4" (ngSubmit)="submit()">
				@if (needsSetup()) {
					<div class="grid gap-3 sm:grid-cols-2">
						<div class="sm:col-span-2">
							<label class="field-label">登录名</label>
							<input
								class="w-full"
								name="username"
								[(ngModel)]="username"
								autocomplete="username"
								placeholder="字母数字 _ - ."
								required
							/>
						</div>
						<div class="sm:col-span-2">
							<label class="field-label">昵称（可选）</label>
							<input
								class="w-full"
								name="displayName"
								[(ngModel)]="displayName"
								placeholder="显示名称，默认与登录名相同"
							/>
						</div>
						<div>
							<label class="field-label">密码</label>
							<input
								class="w-full"
								type="password"
								name="password"
								[(ngModel)]="password"
								autocomplete="new-password"
								placeholder="至少 8 位"
								required
							/>
						</div>
						<div>
							<label class="field-label">确认密码</label>
							<input
								class="w-full"
								type="password"
								name="password2"
								[(ngModel)]="password2"
								autocomplete="new-password"
								required
							/>
						</div>
					</div>
					<p class="text-xs text-muted-2">仅首次可创建；之后请用此账号登录，可在账户设置中修改登录名与密码。</p>
				} @else {
					<div>
						<label class="field-label">用户名</label>
						<input class="w-full" name="username" [(ngModel)]="username" autocomplete="username" required />
					</div>
					<div>
						<label class="field-label">密码</label>
						<input
							class="w-full"
							type="password"
							name="password"
							[(ngModel)]="password"
							autocomplete="current-password"
							required
						/>
					</div>
				}

				@if (error()) {
					<div class="error-box">{{ error() }}</div>
				}

				<button class="btn-primary w-full" type="submit" [disabled]="loading()">
					@if (loading()) {
						{{ needsSetup() ? '创建中…' : '登录中…' }}
					} @else {
						{{ needsSetup() ? '创建并进入' : '登录' }}
					}
				</button>
			</form>
		}
	</div>
</div>
