@if (open) {
	<div class="dialog-overlay" (click)="close()">
		<div class="dialog-panel dialog-panel-md" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
			<div class="dialog-header">
				<button class="dialog-close" type="button" [disabled]="busy()" (click)="close()" title="关闭" aria-label="关闭">
					<span class="dialog-close-x" aria-hidden="true">×</span>
				</button>
				<div class="dialog-header-text">
					<h3 class="dialog-title">{{ editingId ? '编辑订阅源' : '新增订阅源' }}</h3>
					<p class="dialog-header-sub">
						{{ editingId ? '保存后不会自动拉取；改过滤/地区后建议手动拉取' : '保存后会自动拉取一次上游节点' }}
					</p>
				</div>
			</div>
			<div class="dialog-body">
				<div class="grid gap-3 sm:grid-cols-2">
					<!-- 一行：名称 + 地区模式 -->
					<div>
						<label class="field-label">
							名称
							<app-field-tip [text]="tip.name" />
						</label>
						<input class="w-full" [(ngModel)]="formName" placeholder="例如：良心机场" />
					</div>
					<div>
						<label class="field-label">
							地区模式
							<app-field-tip [text]="tip.regionMode" />
						</label>
						<div class="flex h-10 flex-wrap items-center gap-4 text-sm">
							<label class="inline-flex items-center gap-2">
								<input
									type="radio"
									name="regionMode"
									value="auto"
									[ngModel]="formRegionMode"
									(ngModelChange)="onRegionModeChange($event)"
								/>
								自动识别
							</label>
							<label class="inline-flex items-center gap-2">
								<input
									type="radio"
									name="regionMode"
									value="fixed"
									[ngModel]="formRegionMode"
									(ngModelChange)="onRegionModeChange($event)"
								/>
								固定地区
							</label>
						</div>
					</div>

					<!-- 整行：回退地区 / 地区 -->
					<div class="sm:col-span-2">
						<label class="field-label">
							@if (formRegionMode === 'auto') {
								回退地区
							} @else {
								地区
							}
							<app-field-tip [text]="tip.region" />
						</label>
						<select class="w-full" [(ngModel)]="formRegion">
							@if (formRegionMode === 'auto') {
								@for (r of autoRegionOptions(); track r.code) {
									<option [ngValue]="r.code">{{ regionOptionLabel(r) }}</option>
								}
							} @else {
								@for (r of fixedRegionOptions(); track r.code) {
									<option [ngValue]="r.code">{{ regionOptionLabel(r) }}</option>
								}
							}
						</select>
						@if (formRegionMode === 'auto') {
							<p class="mt-1 text-xs text-muted-2">
								默认「未知 (UNKNOWN)」。能认出 🇯🇵/香港 等时用识别结果；认不出才加此前缀。
							</p>
						} @else {
							<p class="mt-1 text-xs text-muted-2">该源全部节点都会加此前缀（如 HK-xxx）。</p>
						}
					</div>

					<!-- 整行：订阅链接 -->
					<div class="sm:col-span-2">
						<label class="field-label">
							订阅 URL
							<app-field-tip [text]="tip.url" />
						</label>
						<input
							class="w-full"
							[(ngModel)]="formUrl"
							[placeholder]="editingId ? '留空表示不修改 URL' : 'https://...'"
						/>
					</div>
				</div>

				<div class="expand-panel mt-4" [class.is-open]="showAdvanced()">
					<button
						type="button"
						class="expand-panel-trigger"
						[attr.aria-expanded]="showAdvanced()"
						(click)="showAdvanced.set(!showAdvanced())"
					>
						<span class="expand-panel-chevron" aria-hidden="true"></span>
						<span class="expand-panel-title">过滤规则</span>
						<span class="expand-panel-hint">名称 / 服务器排除 · 可选白名单</span>
						<span class="expand-panel-state">{{ showAdvanced() ? '收起' : '展开' }}</span>
					</button>
					@if (showAdvanced()) {
						<div class="expand-panel-body">
							<div class="grid gap-3">
								<div>
									<label class="field-label">
										排除名称（正则）
										<app-field-tip [text]="tip.excludeName" />
									</label>
									<textarea class="w-full min-h-16 font-mono text-xs" [(ngModel)]="formExcludeName"></textarea>
								</div>
								<div>
									<label class="field-label">
										排除服务器
										<app-field-tip [text]="tip.excludeServers" />
									</label>
									<input class="w-full font-mono text-xs" [(ngModel)]="formExcludeServers" />
								</div>
								<div>
									<label class="field-label">
										仅包含名称（可选白名单正则）
										<app-field-tip [text]="tip.includeName" />
									</label>
									<input
										class="w-full font-mono text-xs"
										[(ngModel)]="formIncludeName"
										placeholder="例如：日本|香港|JP|HK"
									/>
								</div>
							</div>
						</div>
					}
				</div>
			</div>
			<div class="dialog-actions">
				<button class="btn-secondary" type="button" [disabled]="busy()" (click)="close()">取消</button>
				<button class="btn-primary" type="button" [disabled]="busy()" (click)="save()">
					@if (busy()) {
						处理中…
					} @else if (editingId) {
						保存
					} @else {
						保存并拉取
					}
				</button>
			</div>
		</div>
	</div>
}
