<mat-card class="cardWithShadow m-b-16">
  <mat-card-content>
    <!-- 左：标题 + 说明；右：操作按钮 -->
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-12">
      <div class="flex-fill">
        <div class="d-flex align-items-center gap-12">
          <div class="f-s-20 f-w-600 text-nowrap">{{ title }}</div>
          <ng-content select="[pageToolbarExtra]"></ng-content>
        </div>

        @if (description) {
          <p class="text-muted f-s-12 m-t-8 m-b-0">{{ description }}</p>
        }
        <ng-content select="[pageToolbarDesc]"></ng-content>
      </div>

      <div class="d-flex flex-wrap align-items-center justify-content-end gap-8 m-l-auto">
        <ng-content></ng-content>
      </div>
    </div>
  </mat-card-content>
</mat-card>
