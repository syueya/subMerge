<div class="m-b-16">
  <mat-divider></mat-divider>
</div>
<div mat-dialog-actions class="text-right p-24 p-t-0">
  @if (customCancel) {
    <button mat-stroked-button color="primary" type="button" (click)="cancel.emit()">{{ cancelText }}</button>
  } @else {
    <button mat-stroked-button color="primary" type="button" mat-dialog-close>{{ cancelText }}</button>
  }
  <ng-content></ng-content>
</div>
