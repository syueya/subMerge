@if (smiles) {
  <div class="d-flex flex-col align-items-center gap-8">
    <svg #svgElement [attr.width]="width" [attr.height]="height"></svg>
    @if (errorMessage) {
      <span class="text-error f-s-12">{{ errorMessage }}</span>
    }
  </div>
} @else {
  <div class="text-muted f-s-12">暂无结构式</div>
}
