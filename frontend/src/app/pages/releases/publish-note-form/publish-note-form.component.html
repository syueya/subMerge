<cm-dialog-header modalTitle="发布配置"></cm-dialog-header>

<form class="form" autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()" #formDirective="ngForm">
  <div mat-dialog-content>
    <div class="row">
      <cm-form-field class="col-24" [help]="'可选。只写在发布历史里，方便以后回看这次改了什么。'">
        <mat-label>发布备注</mat-label>
        <mat-form-field appearance="outline" class="w-full" color="primary">
          <input matInput formControlName="note" maxlength="255" placeholder="例如：调整 OpenAI 规则" />
          @if (editForm.get('note')?.hasError('maxlength')) {
            <mat-error>备注不能超过 255 个字符</mat-error>
          }
        </mat-form-field>
      </cm-form-field>
    </div>
  </div>
</form>

<div class="m-b-16">
  <mat-divider></mat-divider>
</div>

<div mat-dialog-actions class="text-right p-24 p-t-0">
  <button mat-stroked-button color="primary" type="button" mat-dialog-close>取消</button>
  <button mat-flat-button color="primary" type="button" [disabled]="editForm.invalid" (click.debounceTime)="submit()">
    确认发布
  </button>
</div>
