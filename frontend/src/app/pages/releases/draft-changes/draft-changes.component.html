<cm-dialog-header [modalTitle]="modalTitle"></cm-dialog-header>

<div mat-dialog-content class="dialog-body-no-scroll">
  @if (summary) {
    <p class="f-s-12 text-warning m-b-12">{{ summary }}</p>
  }
  @if (!changes.length) {
    <cm-no-data [isMin]="true" noDataTitle="暂无差异"></cm-no-data>
  } @else {
    <ul class="m-b-0 p-l-0" style="list-style: none; max-height: min(60vh, 28rem); overflow: auto">
      @for (ch of changes; track $index) {
        <li class="d-flex flex-wrap align-items-start gap-8 f-s-12 m-b-8">
          <span [class]="changeActionClass(ch.action)">{{ changeActionText(ch.action) }}</span>
          <span class="text-muted">{{ changeKindText(ch.kind) }}</span>
          <span>{{ ch.name }}</span>
          @if (ch.detail) {
            <span class="text-muted">（{{ ch.detail }}）</span>
          }
        </li>
      }
    </ul>
  }
</div>

<div class="m-b-16">
  <mat-divider></mat-divider>
</div>

<div mat-dialog-actions class="text-right p-24 p-t-0">
  <button mat-stroked-button color="primary" type="button" (click)="close()">关闭</button>
</div>
