<cm-dialog-header modalTitle="发布配置"></cm-dialog-header>

<form class="form" autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()" #formDirective="ngForm">
  <div mat-dialog-content class="dialog-body-no-scroll">
    <div class="row">
      <cm-form-field class="col-24" [help]="'可选。只写在发布历史里，方便以后回看这次改了什么。'">
        <mat-label>发布备注</mat-label>
        <mat-form-field appearance="outline" class="w-full" color="primary">
          <input matInput formControlName="note" placeholder="例如：调整 OpenAI 规则" />
        </mat-form-field>
      </cm-form-field>
    </div>

    @if (preview(); as p) {
      <div class="d-flex flex-wrap gap-12 f-s-12 m-b-8">
        <div><span class="f-w-600">节点：</span>{{ p.proxyCount }}</div>
        <div><span class="f-w-600">规则：</span>{{ p.ruleCount }}</div>
        <div><span class="f-w-600">策略组：</span>{{ p.groups.join(', ') }}</div>
      </div>
      @if (p.warnings.length) {
        <div class="f-s-12 text-muted m-b-8">
          <ul class="m-t-8 m-b-0">
            @for (w of p.warnings; track w) {
              <li>{{ w }}</li>
            }
          </ul>
        </div>
      }
      <pre
        class="f-s-12 p-12 bg-light-primary rounded text-pre-wrap m-b-0"
        style="overflow: auto; max-height: min(50vh, 28rem)"
      >{{ p.yamlPreview }}</pre>
    }
  </div>
</form>

<div class="m-b-16">
  <mat-divider></mat-divider>
</div>

<div mat-dialog-actions class="text-right p-24 p-t-0">
  <button mat-stroked-button color="primary" type="button" [disabled]="isSubmitting || previewing" mat-dialog-close>
    取消
  </button>
  <button
    mat-stroked-button
    color="primary"
    type="button"
    [disabled]="isSubmitting || previewing"
    (click.debounceTime)="doPreview()"
  >
    {{ previewing && !preview() ? '生成中...' : '生成预览' }}
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="isSubmitting || previewing" (click.debounceTime)="submit()">
    {{ isSubmitting ? '处理中...' : '确认发布' }}
  </button>
</div>
