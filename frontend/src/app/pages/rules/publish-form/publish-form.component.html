<cm-dialog-header modalTitle="发布配置"></cm-dialog-header>

<form class="form" autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()" #formDirective="ngForm">
  <div mat-dialog-content class="mat-subtitle-2 lh-16">
    <p class="text-muted f-s-12 m-b-16">
      先「生成预览」检查 YAML，确认无误后再发布；发布后订阅链接会立刻使用新配置
    </p>

    <div class="row">
      <cm-form-field class="col-24" [help]="tipPublishNote">
        <mat-label>发布备注（可选）</mat-label>
        <mat-form-field appearance="outline" class="w-full" color="primary">
          <input matInput formControlName="note" placeholder="例如：调整 OpenAI 规则" />
        </mat-form-field>
      </cm-form-field>
    </div>

    @if (preview(); as p) {
      <mat-card class="cardWithShadow m-b-16">
        <mat-card-content class="p-16">
          <div class="d-flex flex-wrap gap-16 f-s-14 m-b-12">
            <div>节点：<span class="f-w-600">{{ p.proxyCount }}</span></div>
            <div>规则：<span class="f-w-600">{{ p.ruleCount }}</span></div>
            <div>策略组：<span class="f-w-600">{{ p.groups.join(', ') }}</span></div>
          </div>
          @if (p.warnings.length) {
            <div class="f-s-14 text-muted m-b-12">
              警告：
              <ul class="m-t-8">
                @for (w of p.warnings; track w) {
                  <li>{{ w }}</li>
                }
              </ul>
            </div>
          }
          <pre class="f-s-12 p-12 bg-light-primary rounded" style="white-space: pre-wrap; overflow: auto; max-height: 320px">{{ p.yamlPreview }}</pre>
        </mat-card-content>
      </mat-card>
    }
  </div>
</form>

<div class="m-b-16">
  <mat-divider></mat-divider>
</div>

<div mat-dialog-actions class="text-right p-24 p-t-0">
  <button mat-stroked-button color="primary" type="button" [disabled]="isSubmitting || previewing" mat-dialog-close>
    取消
  </button>
  <button
    mat-stroked-button
    color="primary"
    type="button"
    [disabled]="isSubmitting || previewing"
    (click.debounceTime)="doPreview()"
  >
    {{ previewing && !preview() ? '生成中...' : '生成预览' }}
  </button>
  <button mat-flat-button color="primary" type="button" [disabled]="isSubmitting || previewing" (click.debounceTime)="submit()">
    {{ isSubmitting ? '处理中...' : '确认发布' }}
  </button>
</div>
