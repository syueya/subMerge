<cm-dialog-header modalTitle="系统初始化配置"> </cm-dialog-header>
<form class="form" autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()" #formDirective="ngForm">
  <div mat-dialog-content>
    <mat-card class="cardWithShadow">
      <mat-card-header class="p-x-16 p-t-16">
        <mat-card-title>管理员信息</mat-card-title>
      </mat-card-header>
      <div class="m-t-8">
        <mat-divider></mat-divider>
      </div>
      <mat-card-content class="p-16">
        <div class="row">
          <cm-form-field class="col-24 col-md-12">
            <mat-label>昵称</mat-label>
            <mat-form-field appearance="outline" class="w-full" color="primary">
              <input matInput type="text" formControlName="nickName" autocomplete="off" />
              <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
            </mat-form-field>
          </cm-form-field>
          <cm-form-field class="col-24 col-md-12">
            <mat-label>用户名<cm-required-mark class="m-l-4"></cm-required-mark></mat-label>
            <mat-form-field appearance="outline" class="w-full" color="primary">
              <input matInput type="text" formControlName="userName" autocomplete="off" />
              <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
            </mat-form-field>
          </cm-form-field>
          <cm-form-field class="col-24 col-md-12">
            <mat-label>密码<cm-required-mark class="m-l-4"></cm-required-mark></mat-label>
            <mat-form-field appearance="outline" class="w-full" color="primary">
              <input matInput type="password" formControlName="password" autocomplete="off" />
              <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
            </mat-form-field>
          </cm-form-field>
          <cm-form-field class="col-24 col-md-12">
            <mat-label>确认密码<cm-required-mark class="m-l-4"></cm-required-mark></mat-label>
            <mat-form-field appearance="outline" class="w-full" color="primary">
              <input matInput type="password" formControlName="passwordSecond" autocomplete="off" />
              <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
            </mat-form-field>
          </cm-form-field>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</form>

<cm-dialog-footer>

  
  <button mat-flat-button color="primary" type="button" [disabled]="!canSubmit || isSubmitting" (click.debounceTime)="submit()">保存</button>
</cm-dialog-footer>
