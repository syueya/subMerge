<div class="login-page blank-layout-container justify-content-center align-items-center">
  <div class="login-page__bg"></div>

  <div class="login-page__shell">
    <mat-card class="login-card cardWithShadow">
      <mat-card-content class="login-card__content">
        <div class="login-brand">
          <img src="./assets/images/logos/favicon.svg" class="login-brand__logo" alt="SubMerge" />
          <div class="login-brand__text">
            <h1 class="login-brand__title">SubMerge</h1>
            <p class="login-brand__subtitle">
              @if (checking()) {
                Clash 订阅合并与配置下发面板
              } @else if (needsSetup()) {
                首次使用：创建管理员账号
              } @else {
                登录管理面板
              }
            </p>
          </div>
        </div>

        @if (checking()) {
          <p class="m-t-16 text-muted">检查初始化状态…</p>
        } @else {
          <form class="login-form" autocomplete="off" (ngSubmit)="submit()">
            @if (needsSetup()) {
              <mat-label class="login-form__label">登录名</mat-label>
              <mat-form-field appearance="outline" class="w-full" color="primary">
                <i-tabler name="user" class="icon-22 login-form__icon" matPrefix></i-tabler>
                <input matInput name="username" [(ngModel)]="username" placeholder="字母数字 _ - ." autocomplete="username" />
              </mat-form-field>

              <mat-label class="login-form__label">昵称（可选）</mat-label>
              <mat-form-field appearance="outline" class="w-full" color="primary">
                <i-tabler name="id" class="icon-22 login-form__icon" matPrefix></i-tabler>
                <input matInput name="displayName" [(ngModel)]="displayName" placeholder="显示名称，默认与登录名相同" />
              </mat-form-field>

              <mat-label class="login-form__label">密码（至少 10 位）</mat-label>
              <mat-form-field appearance="outline" class="w-full" color="primary">
                <i-tabler name="lock" class="icon-22 login-form__icon" matPrefix></i-tabler>
                <input matInput type="password" name="password" [(ngModel)]="password" placeholder="至少 10 位" autocomplete="new-password" />
              </mat-form-field>

              <mat-label class="login-form__label">确认密码</mat-label>
              <mat-form-field appearance="outline" class="w-full" color="primary">
                <i-tabler name="lock" class="icon-22 login-form__icon" matPrefix></i-tabler>
                <input matInput type="password" name="password2" [(ngModel)]="password2" placeholder="再次输入密码" autocomplete="new-password" />
              </mat-form-field>

              <p class="f-s-12 text-muted m-b-12">仅首次可创建；之后请用此账号登录，可在账户设置中修改登录名与密码。</p>
            } @else {
              <mat-label class="login-form__label">用户名</mat-label>
              <mat-form-field appearance="outline" class="w-full" color="primary">
                <i-tabler name="user" class="icon-22 login-form__icon" matPrefix></i-tabler>
                <input matInput name="username" [(ngModel)]="username" placeholder="请输入用户名" autocomplete="username" />
              </mat-form-field>

              <mat-label class="login-form__label">密码</mat-label>
              <mat-form-field appearance="outline" class="w-full" color="primary">
                <i-tabler name="lock" class="icon-22 login-form__icon" matPrefix></i-tabler>
                <input matInput type="password" name="password" [(ngModel)]="password" placeholder="请输入密码" autocomplete="current-password" />
              </mat-form-field>
            }

            @if (error()) {
              <div class="m-b-12 text-error f-s-13">{{ error() }}</div>
            }

            <button mat-flat-button color="primary" type="submit" class="login-form__submit w-full" [disabled]="loading()">
              @if (loading()) {
                {{ needsSetup() ? '创建中…' : '登录中…' }}
              } @else {
                {{ needsSetup() ? '创建并进入' : '登 录' }}
              }
            </button>
          </form>
        }
      </mat-card-content>
    </mat-card>
  </div>
</div>
