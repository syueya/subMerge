<cm-page-toolbar title="系统设置" description="可调整的应用配置统一保存在数据库中，不读取同名环境变量；敏感信息不会完整显示。">
  <button mat-flat-button color="primary" type="button" [disabled]="saving()" (click)="save()">{{ saving() ? '保存中…' : '保存系统设置' }}</button>
  <button mat-stroked-button type="button" [disabled]="saving()" (click)="reset()">恢复系统默认</button>
</cm-page-toolbar>

@if (loading()) {
  <div class="p-y-24 text-center"><mat-spinner diameter="32"></mat-spinner></div>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-0">
        <mat-tab-group mat-stretch-tabs="false">
          <mat-tab>
            <ng-template mat-tab-label>
              <div class="d-flex align-items-center">
                <i-tabler name="shield-check" class="icon-20 m-r-8"></i-tabler>
              </div>
              部署与安全
            </ng-template>
            <ng-template matTabContent>
              <mat-card-content>
                <h3 class="m-b-12 ">部署与安全</h3>
                <div class="row p-8">
                  <cm-form-field class="col-24 col-md-6" [help]="help('HTTPS 反代通常开启；纯 HTTP 访问请关闭。', 'deployment.cookie_secure')">
                    <mat-label>启用Secure</mat-label>
                    <mat-slide-toggle formControlName="cookieSecure"></mat-slide-toggle>
                  </cm-form-field>
                  <cm-form-field class="col-24 col-md-8" [help]="help('对外公开访问地址，影响管理端生成的订阅链接。', 'deployment.public_base_url')">
                    <mat-label>公开访问地址</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="publicBaseUrl" placeholder="https://sub.example.com">
                    </mat-form-field>
                  </cm-form-field>
                  <cm-form-field class="col-24 col-md-8" [help]="help('无反向代理请留空；多个地址用逗号分隔；保存后需重启服务生效。', 'deployment.trusted_proxies')">
                    <mat-label>可信反向代理 IP/CIDR</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="trustedProxies" placeholder="172.16.0.0/12, 127.0.0.1">
                    </mat-form-field>
                  </cm-form-field>
                </div>

                <mat-divider class="m-y-12"></mat-divider>

                <h3 class="m-b-12">日志</h3>
                <div class="row p-8">
                  <cm-form-field class="col-24 col-md-6" [help]="'开启后输出更详细的运行日志，包括分流规则匹配过程、Geo 地区判断、过滤条件等，便于排查配置问题。'">
                    <mat-label>启用详细日志</mat-label>
                    <mat-slide-toggle formControlName="debugLogging"></mat-slide-toggle>
                  </cm-form-field>
                  <cm-form-field class="col-24 col-md-8" [help]="'选择日志输出目标：控制台、文件、两者同时或关闭。'">
                    <mat-label>日志输出</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <mat-select formControlName="logOutput">
                        <mat-option value="console">控制台</mat-option>
                        <mat-option value="file">文件</mat-option>
                        <mat-option value="both">控制台和文件</mat-option>
                        <mat-option value="none">关闭</mat-option>
                      </mat-select>
                    </mat-form-field>
                  </cm-form-field>
                  <cm-form-field class="col-24 col-md-8" [help]="'0 表示不自动清理'">
                    <mat-label>日志保留天数</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput type="number" formControlName="logRetentionDays">
                    </mat-form-field>
                  </cm-form-field>
                </div>
              </mat-card-content>
            </ng-template>
          </mat-tab>

          <mat-tab>
            <ng-template mat-tab-label>
              <div class="d-flex align-items-center">
                <i-tabler name="cloud-download" class="icon-20 m-r-8"></i-tabler>
              </div>
              数据获取
            </ng-template>
            <ng-template matTabContent>
              <mat-card-content>
                <h3 class="m-b-12">出站代理</h3>
                <div class="row p-8">
                  <cm-form-field class="col-24 col-md-6" [help]="'开启后，订阅源拉取和 Geo 更新将通过下方代理 URL 进行。'">
                    <mat-label>启用出站代理</mat-label>
                    <mat-slide-toggle formControlName="proxyEnabled"></mat-slide-toggle>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-12" [help]="'支持 http、https、socks5、socks5h，可包含认证信息；不会回填密码。用于订阅源和 Geo 更新，不影响网络检测临时代理，空 URL 会清除代理并直连。'">
                    <mat-label>代理 URL</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="proxyUrl" placeholder="http://127.0.0.1:7890">
                    </mat-form-field>
                  </cm-form-field>
                </div>
                <mat-divider class="m-y-12"></mat-divider>

                <h3 class="m-b-12">订阅源</h3>
                <div class="row p-8">
                  <cm-form-field class="col-24 col-md-6" [help]="help('拉取订阅源使用的客户端标识，部分订阅源会校验来源。', 'source.fetch.ua')">
                    <mat-label>User-Agent</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="sourceFetchUA">
                    </mat-form-field>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-6" [help]="help('拉取订阅源的请求超时时间。', 'source.fetch.timeout')">
                    <mat-label>请求超时</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="sourceFetchTimeout" placeholder="30s">
                    </mat-form-field>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-6" [help]="help('单次拉取订阅允许的最大响应体大小，超出后丢弃。', 'source.fetch.max_bytes')">
                    <mat-label>最大响应大小（MB）</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput type="number" formControlName="sourceMaxBytes">
                    </mat-form-field>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-6" [help]="help('自动刷新订阅的间隔，范围 1-720 小时。', 'source.refresh.hours') + '保存后立即影响后续拉取；刷新间隔保存后需重启服务生效。'">
                    <mat-label>自动刷新间隔（小时）</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput type="number" formControlName="refreshInterval">
                    </mat-form-field>
                  </cm-form-field>
                </div>

                <mat-divider class="m-y-12"></mat-divider>

                <h3 class="m-b-12">Geo 与 IP 归属地</h3>
                <div class="row p-8">
                  <cm-form-field class="col-24 col-md-12" [help]="'独立 IP 归属地查询接口 URL，用于根据 IP 地址定位所在地区。'">
                    <mat-label>IP 归属地 URL</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="ipGeoUrl">
                    </mat-form-field>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-12" [help]="'查询 IP 归属地的请求超时时间。'">
                    <mat-label>IP 归属地超时（秒）</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput type="number" formControlName="ipGeoTimeout">
                    </mat-form-field>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-24" [help]="'GeoIP 数据库下载地址，用于按 IP 判断所属地区。'">
                    <mat-label>GeoIP URL</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="geoipUrl">
                    </mat-form-field>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-24" [help]="'GeoSite 站点分类数据库下载地址，用于分流规则按站点匹配。'">
                    <mat-label>GeoSite URL</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="geositeUrl">
                    </mat-form-field>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-24" [help]="'GeoDB 数据库下载地址。'">
                    <mat-label>GeoDB URL</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="geodbUrl">
                    </mat-form-field>
                  </cm-form-field>

                  <cm-form-field class="col-24 col-md-24" [help]="'Geo ASN 数据库下载地址，用于按 ASN 归属判断。'">
                    <mat-label>Geo ASN URL</mat-label>
                    <mat-form-field appearance="outline" class="w-full">
                      <input matInput formControlName="geoasnUrl">
                    </mat-form-field>
                  </cm-form-field>
                </div>

              </mat-card-content>
            </ng-template>
          </mat-tab>

        </mat-tab-group>
      </mat-card-content>
    </mat-card>


  </form>
}
