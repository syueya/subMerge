<cm-dialog-header [modalTitle]="title"></cm-dialog-header>

<div mat-dialog-content class="mat-subtitle-2 lh-16">
  @if (subtitle) {
    <p class="text-muted f-s-12 m-b-12">{{ subtitle }}</p>
  }

  @if (loading) {
    <div class="d-flex justify-content-center p-24">
      <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
    </div>
  } @else if (!items.length) {
    <cm-no-data [isMin]="true" noDataTitle="暂无条目"></cm-no-data>
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" [trackBy]="tableTrackBy" class="m-t-0 w-full">
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>类型</th>
          <td mat-cell *matCellDef="let row" class="f-s-14 text-nowrap">{{ row.type }}</td>
        </ng-container>
        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef>值</th>
          <td mat-cell *matCellDef="let row" class="f-s-12" style="word-break: break-all">{{ row.value }}</td>
        </ng-container>
        <ng-container matColumnDef="detail">
          <th mat-header-cell *matHeaderCellDef>详情</th>
          <td mat-cell *matCellDef="let row" class="f-s-12 text-muted" style="word-break: break-all">
            {{ row.detail || '—' }}
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  }

  @if (paginated) {
    <div class="d-flex align-items-center justify-content-between gap-8 m-t-16">
      <span class="f-s-12 text-muted">{{ rangeText() }}</span>
      <div class="d-flex gap-8">
        <button mat-stroked-button color="primary" type="button" [disabled]="!canPrevious()" (click.debounceTime)="previous()">
          上一页
        </button>
        <button mat-stroked-button color="primary" type="button" [disabled]="!canNext()" (click.debounceTime)="next()">
          下一页
        </button>
      </div>
    </div>
  }
</div>

<div class="m-b-16">
  <mat-divider></mat-divider>
</div>

<div mat-dialog-actions class="text-right p-24 p-t-0">
  <button mat-stroked-button color="primary" type="button" (click.debounceTime)="close()">关闭</button>
</div>
