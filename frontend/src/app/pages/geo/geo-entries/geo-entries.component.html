<cm-dialog-header [modalTitle]="title"></cm-dialog-header>

<div mat-dialog-content>
  @if (loading) {
    <div class="d-flex justify-content-center p-24">
      <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
    </div>
  } @else if (!items.length) {
    <cm-no-data [isMin]="true" noDataTitle="暂无条目"></cm-no-data>
  } @else {
    <div class="row">
      @for (row of items; track trackBy($index, row)) {
        <div class="col-24 col-md-6 col-xl-4 m-b-8">
          <div class="p-12 rounded b-1 h-100 d-flex flex-wrap align-items-center gap-8">
            <span [class]="badgeMuted" class="text-nowrap">{{ row.type }}</span>
            <div class="min-w-0 f-s-12 f-w-600" style="word-break: break-all">{{ row.value }}</div>
            @if (row.detail) {
              <div class="f-s-12 text-muted m-l-auto text-right" style="word-break: break-all">{{ row.detail }}</div>
            }
          </div>
        </div>
      }
    </div>
  }
</div>

@if (paginated) {
  <mat-paginator
    [length]="total"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    [showFirstLastButtons]="true"
    [disabled]="loading"
    (page)="onPage($event)"
  ></mat-paginator>
}

<div class="m-b-16">
  <mat-divider></mat-divider>
</div>

<div mat-dialog-actions class="text-right p-24 p-t-0">
  <button mat-stroked-button color="primary" type="button" (click.debounceTime)="close()">关闭</button>
</div>
