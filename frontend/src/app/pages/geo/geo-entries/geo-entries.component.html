<cm-dialog-header [modalTitle]="title"></cm-dialog-header>

<div mat-dialog-content>
  @if (loading) {
    <div class="d-flex justify-content-center p-24">
      <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
    </div>
  } @else if (!items.length) {
    <cm-no-data [isMin]="true" noDataTitle="暂无条目"></cm-no-data>
  } @else {
    <div class="row">
      @for (row of items; track trackBy($index, row)) {
        <div class="col-24 col-md-6 col-xl-4 m-b-8">
          <div class="p-12 rounded b-1 h-100 d-flex align-items-center gap-8 overflow-hidden">
            <span [class]="badgeMuted" class="text-nowrap flex-shrink-0">{{ row.type }}</span>
            <div class="min-w-0 flex-1-auto f-s-12 f-w-600 text-truncate" [matTooltip]="row.value" matTooltipShowDelay="500">
              {{ row.value }}
            </div>
            @if (row.detail) {
              <div class="min-w-0 max-w-40 flex-shrink-0 f-s-12 text-muted text-truncate text-right" [matTooltip]="row.detail" matTooltipShowDelay="500">
                {{ row.detail }}
              </div>
            }
          </div>
        </div>
      }
    </div>
  }
</div>

@if (paginated) {
  <mat-paginator
    [length]="total"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    [showFirstLastButtons]="true"
    [disabled]="loading"
    (page)="onPage($event)"
  ></mat-paginator>
}

<cm-dialog-footer cancelText="关闭" [customCancel]="true" (cancel)="close()">

  @if (canAddRule) {
    <button mat-flat-button color="primary" type="button" (click.debounceTime)="addRule()">添加规则</button>
  }
</cm-dialog-footer>
