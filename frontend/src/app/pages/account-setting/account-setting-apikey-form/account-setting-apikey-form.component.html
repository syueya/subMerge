<cm-dialog-header [modalTitle]="modalTitle"></cm-dialog-header>

<form class="form" autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()" #formDirective="ngForm">
  <div mat-dialog-content>
    <div class="row">
      <cm-form-field class="col-24" [help]="'仅用于识别，例如 ops-agent、ci-publish'">
        <mat-label>名称<cm-required-mark class="m-l-4"></cm-required-mark></mat-label>
        <mat-form-field appearance="outline" class="w-full" color="primary">
          <input matInput type="text" formControlName="name" placeholder="例如：ops-agent" />
          <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
        </mat-form-field>
      </cm-form-field>

      <cm-form-field class="col-24">
        <mat-label>备注</mat-label>
        <mat-form-field appearance="outline" class="w-full" color="primary">
          <input matInput type="text" formControlName="note" placeholder="可选说明" />
          <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
        </mat-form-field>
      </cm-form-field>

      <div class="col-24 m-b-12">
        <div class="f-w-600 f-s-14 m-b-8">
          权限
          <cm-required-mark class="m-l-4"></cm-required-mark>
        </div>
        <mat-chip-listbox
          class="d-flex flex-wrap"
          aria-label="API 密钥权限"
          multiple
          hideSingleSelectionIndicator
          [value]="selectedScopes()"
          (change)="onScopeChange($event)"
        >
          @for (opt of scopeOptions; track opt.value) {
            <mat-chip-option
              [value]="opt.value"
              [matTooltip]="scopeHint(opt.value)"
              matTooltipShowDelay="300"
            >
              {{ opt.text }}
            </mat-chip-option>
          }
          </mat-chip-listbox>
          @if (isScopeInvalid()) {
            <mat-error>请至少选择一个权限</mat-error>
          }
        </div>
    </div>
  </div>
</form>

<cm-dialog-footer>

  
  <button mat-flat-button color="primary" type="button" [disabled]="isSubmitting" (click.debounceTime)="submit()">
    @if (isEdit) {
      {{ isSubmitting ? '保存中...' : '保存' }}
    } @else {
      {{ isSubmitting ? '创建中...' : '创建' }}
    }
  </button>
</cm-dialog-footer>
