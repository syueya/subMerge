<mat-card class="cardWithShadow">
  <mat-card-content>
    <mat-card-title>基本信息</mat-card-title>
    <mat-card-subtitle class="mat-body-1">修改登录名与显示昵称</mat-card-subtitle>
    <form autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()">
      <div class="row m-t-24">
        <div class="col-sm-12">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">登录名<cm-required-mark></cm-required-mark></mat-label>
          <mat-form-field appearance="outline" class="w-full" color="primary">
            <input matInput type="text" formControlName="userName" />
            <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
          </mat-form-field>
        </div>
        <div class="col-sm-12">
          <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">昵称</mat-label>
          <mat-form-field appearance="outline" class="w-full" color="primary">
            <input matInput type="text" formControlName="nickName" />
            <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="text-right p-t-0 m-t-24">
        <button mat-flat-button color="primary" type="button" class="m-r-8" [disabled]="!canSubmit || isSubmitting" (click.debounceTime)="submit()">保存修改</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
