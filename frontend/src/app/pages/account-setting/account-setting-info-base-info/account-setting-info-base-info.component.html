<mat-card class="cardWithShadow">
  <mat-card-content>
    <mat-card-title>基本信息</mat-card-title>
    <mat-card-subtitle class="mat-body-1">修改登录名与显示昵称</mat-card-subtitle>
    <form class="form m-t-24" autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()">
      <div class="row">
        <cm-form-field class="col-24 col-md-12">
          <mat-label>登录名<cm-required-mark class="m-l-4"></cm-required-mark></mat-label>
          <mat-form-field appearance="outline" class="w-full" color="primary">
            <input matInput type="text" formControlName="userName" />
            <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
          </mat-form-field>
        </cm-form-field>

        <cm-form-field class="col-24 col-md-12">
          <mat-label>昵称</mat-label>
          <mat-form-field appearance="outline" class="w-full" color="primary">
            <input matInput type="text" formControlName="nickName" />
            <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
          </mat-form-field>
        </cm-form-field>
      </div>

      <div class="text-right m-t-8">
        <button
          mat-flat-button
          color="primary"
          type="button"
          [disabled]="!canSubmit || isSubmitting"
          (click.debounceTime)="submit()"
        >
          {{ isSubmitting ? '保存中...' : '保存修改' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
