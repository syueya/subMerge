<cm-dialog-header [modalTitle]="'API 密钥 · ' + data.name"></cm-dialog-header>

<div mat-dialog-content>
  <p class="text-muted f-s-12 m-b-12">
    {{ data.hint || '请妥善保管。可随时在此页面再次查看。' }}
  </p>
  <div class="d-flex align-items-start gap-8">
    <code class="f-s-13 p-12 bg-light rounded flex-grow-1" style="word-break: break-all; user-select: all">{{
      data.key
    }}</code>
    <button mat-icon-button color="primary" type="button" matTooltip="复制" (click.debounceTime)="copy()">
      <i-tabler name="copy" class="icon-24 d-flex align-items-center"></i-tabler>
    </button>
  </div>
  <p class="f-s-12 text-muted m-t-16 m-b-0">
    调用时在请求头携带：
    <code>Authorization: Bearer &lt;key&gt;</code>
  </p>
</div>

<cm-dialog-footer>

</cm-dialog-footer>
