<cm-dialog-header modalTitle="请选择一张用户头像"> </cm-dialog-header>
<div mat-dialog-content>
  <div class="row avatar-list">
    @for (item of avatarList; track trackByAvatar(i, item); let i = $index) {
<div class="col-4 p-t-10 p-b-10">
      <img [src]="item.src" width="100%" class="rounded-circle avatar-item" [class.active]="item.value === activeAvatar" (click)="activeAvatar = item.value" />
    </div>
}
  </div>
</div>

<cm-dialog-footer>

  
  <button mat-flat-button color="primary" type="button" [disabled]="!activeAvatar || isSubmitting" (click.debounceTime)="submit()">保存</button>
</cm-dialog-footer>
