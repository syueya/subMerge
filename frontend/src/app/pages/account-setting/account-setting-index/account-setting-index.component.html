<mat-card class="cardWithShadow">
  <mat-card-content class="p-0">
    <mat-tab-group mat-stretch-tabs="false">
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="d-flex align-items-center">
            <i-tabler name="user" class="icon-20 m-r-8"></i-tabler>
          </div>
          账户信息
        </ng-template>
        <ng-template matTabContent>
          <app-account-setting-info></app-account-setting-info>
        </ng-template>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="d-flex align-items-center">
            <i-tabler name="key" class="icon-20 m-r-8"></i-tabler>
          </div>
          API 密钥
        </ng-template>
        <ng-template matTabContent>
          <app-account-setting-apikeys></app-account-setting-apikeys>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
