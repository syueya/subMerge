<mat-card class="cardWithShadow">
  <mat-card-content class="p-y-24">
    <mat-card-title>修改密码</mat-card-title>
    <mat-card-subtitle class="mat-body-1">在这里修改您的账户登录密码</mat-card-subtitle>
    <form class="form m-t-24" autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()">
      <div class="row">
        <cm-form-field class="col-24">
          <mat-label>当前密码<cm-required-mark class="m-l-4"></cm-required-mark></mat-label>
          <mat-form-field appearance="outline" class="w-full" color="primary">
            <input matInput type="password" formControlName="oldPassword" autocomplete="off" />
            <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
          </mat-form-field>
        </cm-form-field>

        <cm-form-field class="col-24">
          <mat-label>新密码<cm-required-mark class="m-l-4"></cm-required-mark></mat-label>
          <mat-form-field appearance="outline" class="w-full" color="primary">
            <input matInput type="password" formControlName="password" autocomplete="off" />
            <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
          </mat-form-field>
        </cm-form-field>

        <cm-form-field class="col-24">
          <mat-label>确认密码<cm-required-mark class="m-l-4"></cm-required-mark></mat-label>
          <mat-form-field appearance="outline" class="w-full" color="primary">
            <input matInput type="password" formControlName="passwordSecond" autocomplete="off" />
            <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
          </mat-form-field>
        </cm-form-field>
      </div>

      <div class="text-right m-t-8">
        <button
          mat-flat-button
          color="primary"
          type="button"
          [disabled]="!canSubmit || isSubmitting"
          (click.debounceTime)="submit()"
        >
          {{ isSubmitting ? '保存中...' : '保存修改' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
