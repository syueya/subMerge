<mat-card class="cardWithShadow">
  <mat-card-content class="p-y-24">
    <mat-card-title>修改密码</mat-card-title>
    <mat-card-subtitle class="mat-body-1">在这里修改您的账户登录密码</mat-card-subtitle>
    <form class="m-t-24" autocomplete="off" [formGroup]="editForm" (ngSubmit)="submit()">
      <!-- input -->
      <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">当前密码<cm-required-mark></cm-required-mark></mat-label>
      <mat-form-field appearance="outline" class="w-full" color="primary">
        <input matInput type="password" formControlName="oldPassword" autocomplete="off"/>
        <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
      </mat-form-field>
      <!-- input -->
      <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">新密码<cm-required-mark></cm-required-mark></mat-label>
      <mat-form-field appearance="outline" class="w-full" color="primary">
        <input matInput type="password" formControlName="password" autocomplete="off" />
        <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
      </mat-form-field>
      <!-- input -->
      <mat-label class="mat-subtitle-2 f-w-600 m-b-8 d-block">确认密码<cm-required-mark></cm-required-mark></mat-label>
      <mat-form-field appearance="outline" class="w-full" color="primary">
        <input matInput type="password" formControlName="passwordSecond" autocomplete="off" />
        <mat-error class="m-b-16 text-right"><cm-form-field-error></cm-form-field-error></mat-error>
      </mat-form-field>
      <div class="text-right p-t-0 m-t-8">
        <button mat-flat-button color="primary" type="button" class="m-r-8" [disabled]="!canSubmit || isSubmitting" (click.debounceTime)="submit()">保存修改</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
