<cm-dialog-header modalTitle="检测设置"></cm-dialog-header>

<div mat-dialog-content>
  <div class="row m-b-8">
    <cm-form-field class="col-24 col-md-12" [help]="'单个目标请求超时时间。'">
      <mat-label>超时（秒）</mat-label>
      <mat-form-field appearance="outline" class="w-full" color="primary">
        <input
          matInput
          type="number"
          min="1"
          max="120"
          [ngModel]="config().timeout"
          (ngModelChange)="updateField('timeout', $event)"
        />
      </mat-form-field>
    </cm-form-field>
    <cm-form-field class="col-24 col-md-12" [help]="'0 表示关闭自动刷新。'">
      <mat-label>自动刷新（秒，0 为关闭）</mat-label>
      <mat-form-field appearance="outline" class="w-full" color="primary">
        <input
          matInput
          type="number"
          min="0"
          max="3600"
          [ngModel]="config().autoRefresh"
          (ngModelChange)="updateField('autoRefresh', $event)"
        />
      </mat-form-field>
    </cm-form-field>
  </div>

  <cm-collapse-panel [expanded]="true">
    <span cmCollapseTitle class="d-flex align-items-center flex-wrap gap-8">
      <span class="f-w-600 f-s-14">检测目标</span>
      <span class="f-s-12 text-muted">{{ config().targets.length }} 个</span>
    </span>
    <button
      cmCollapseAction
      mat-stroked-button
      type="button"
      [disabled]="resetting()"
      (click.debounceTime)="resetConfig()"
    >
      {{ resetting() ? '恢复中…' : '恢复默认' }}
    </button>
    <button
      cmCollapseAction
      mat-stroked-button
      color="primary"
      type="button"
      (click.debounceTime)="addTarget()"
    >
      添加目标
    </button>

    <div class="table-container">
      <table mat-table [dataSource]="config().targets" class="w-full">
        <ng-container matColumnDef="enabled">
          <th mat-header-cell *matHeaderCellDef>启用</th>
          <td mat-cell *matCellDef="let target; let i = index">
            <mat-checkbox [checked]="target.enabled" (change)="toggleTarget(i, $event.checked)" color="primary"></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>名称</th>
          <td mat-cell *matCellDef="let target; let i = index">
            <mat-form-field appearance="outline" class="w-full m-y-4">
              <input matInput [value]="target.name" maxlength="80" (input)="updateTarget(i, 'name', $any($event.target).value)" />
            </mat-form-field>
          </td>
        </ng-container>

        <ng-container matColumnDef="url">
          <th mat-header-cell *matHeaderCellDef>URL</th>
          <td mat-cell *matCellDef="let target; let i = index">
            <mat-form-field appearance="outline" class="w-full m-y-4">
              <input matInput [value]="target.url" type="url" (input)="updateTarget(i, 'url', $any($event.target).value)" />
            </mat-form-field>
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>操作</th>
          <td mat-cell *matCellDef="let target; let i = index">
            <button mat-icon-button color="warn" type="button" matTooltip="删除目标" (click.debounceTime)="removeTarget(i)">
              <i-tabler name="trash" class="icon-18"></i-tabler>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['enabled', 'name', 'url', 'action']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['enabled', 'name', 'url', 'action']"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            <cm-no-data [isMin]="true" noDataTitle="暂无检测目标"></cm-no-data>
          </td>
        </tr>
      </table>
    </div>
  </cm-collapse-panel>
</div>

<div class="m-b-16">
  <mat-divider></mat-divider>
</div>

<div mat-dialog-actions class="text-right p-24 p-t-0">
  <button mat-stroked-button color="primary" type="button" mat-dialog-close>取消</button>
  <button mat-flat-button color="primary" type="button" [disabled]="saving()" (click)="saveConfig()">
    {{ saving() ? '保存中…' : '保存设置' }}
  </button>
</div>
